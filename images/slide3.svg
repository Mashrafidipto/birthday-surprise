<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14060d" />
      <stop offset="50%" stop-color="#330c1e" />
      <stop offset="100%" stop-color="#1a040d" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff758f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1a040d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#roseBg)" />
  <circle cx="400" cy="550" r="300" fill="url(#roseGlow)" />
  <!-- Artistic Blooming Rose Petals Centerpiece -->
  <g transform="translate(400, 560)" fill="none" stroke="#ff4d6d" stroke-width="3">
    <!-- Heart Petals -->
    <path d="M0,0 C-100,-150 -200,-50 -100,80 C-40,150 0,200 0,200 C0,200 40,150 100,80 C200,-50 100,-150 0,0 Z" fill="#75152a" opacity="0.5" stroke="#ff758f" stroke-width="4" />
    <path d="M0,20 C-60,-90 -130,-20 -60,60 C-20,110 0,140 0,140 C0,140 20,110 60,60 C130,-20 60,-90 0,20 Z" fill="#a82340" opacity="0.7" stroke="#ffa3b5" stroke-width="3" />
    <path d="M0,40 C-30,-30 -70,10 -30,60 C-10,90 0,100 0,100 C0,100 10,90 30,60 C70,10 30,-30 0,40 Z" fill="#ff4d6d" opacity="0.9" stroke="#fff" stroke-width="2" />
  </g>
  <!-- Floating Petals -->
  <g fill="#ff758f" opacity="0.7">
    <ellipse cx="220" cy="380" rx="20" ry="12" transform="rotate(-30 220 380)" />
    <ellipse cx="580" cy="420" rx="18" ry="10" transform="rotate(40 580 420)" />
    <ellipse cx="260" cy="750" rx="22" ry="14" transform="rotate(25 260 750)" />
    <ellipse cx="540" cy="780" rx="19" ry="11" transform="rotate(-45 540 780)" />
  </g>
  <!-- Gold Starlight Accent -->
  <g fill="#ffe082">
    <circle cx="400" cy="280" r="3" />
    <circle cx="360" cy="310" r="2" />
    <circle cx="440" cy="320" r="2" />
    <circle cx="400" cy="850" r="3" />
  </g>
</svg>
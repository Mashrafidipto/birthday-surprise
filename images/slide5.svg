<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="partyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0512" />
      <stop offset="45%" stop-color="#1f0e2e" />
      <stop offset="80%" stop-color="#3d1445" />
      <stop offset="100%" stop-color="#150517" />
    </linearGradient>
    <radialGradient id="sparkleCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fd79a8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0a0512" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#partyBg)" />
  <circle cx="400" cy="500" r="350" fill="url(#sparkleCenter)" />
  <!-- Big Stylized Heart Crown / Celebration Motif -->
  <g transform="translate(400, 500)">
    <!-- Main Heart -->
    <path d="M0,-60 C-80,-180 -220,-80 -120,60 C-50,140 0,190 0,190 C0,190 50,140 120,60 C220,-80 80,-180 0,-60 Z" fill="none" stroke="#ffd700" stroke-width="5" opacity="0.85" filter="drop-shadow(0 0 18px #ffb142)" />
    <!-- Little Sparkles radiating out -->
    <path d="M0,-190 L0,-240 M0,210 L0,260 M-210,0 L-260,0 M210,0 L260,0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <path d="M-140,-140 L-180,-180 M140,-140 L180,-180 M-140,140 L-180,180 M140,140 L180,180" stroke="#ffeaa7" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Confetti Elements -->
  <g>
    <rect x="220" y="240" width="16" height="8" rx="3" fill="#ff7675" transform="rotate(25 220 240)" />
    <rect x="580" y="280" width="14" height="7" rx="3" fill="#ffeaa7" transform="rotate(-35 580 280)" />
    <rect x="180" y="720" width="18" height="9" rx="3" fill="#74b9ff" transform="rotate(50 180 720)" />
    <rect x="620" y="690" width="15" height="8" rx="3" fill="#a29bfe" transform="rotate(-20 620 690)" />
    <circle cx="280" cy="380" r="6" fill="#fd79a8" />
    <circle cx="530" cy="360" r="5" fill="#55efc4" />
    <circle cx="400" cy="800" r="7" fill="#ffeaa7" />
  </g>
</svg>
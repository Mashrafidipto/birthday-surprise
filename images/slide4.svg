<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120908" />
      <stop offset="50%" stop-color="#2a1612" />
      <stop offset="100%" stop-color="#0e0605" />
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="1" />
      <stop offset="40%" stop-color="#fca311" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2a1612" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#warmBg)" />
  <!-- Candlelit Envelope / Parchment Motif -->
  <circle cx="400" cy="520" r="260" fill="url(#candleGlow)" />
  <!-- Letter Envelope -->
  <g transform="translate(400, 600)">
    <!-- Envelope Body -->
    <rect x="-180" y="-100" width="360" height="230" rx="14" fill="#fdf0d5" stroke="#d4af37" stroke-width="2" />
    <!-- Flap Fold -->
    <path d="M-180,-100 L0,40 L180,-100" fill="none" stroke="#e0cfa5" stroke-width="2.5" />
    <!-- Golden Wax Seal -->
    <circle cx="0" cy="40" r="38" fill="#a4161a" stroke="#d4af37" stroke-width="3" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))" />
    <path d="M0,28 C-6,20 -18,20 -18,32 C-18,44 0,56 0,56 C0,56 18,44 18,32 C18,20 6,20 0,28 Z" fill="#fdf0d5" />
  </g>
  <!-- Flame at top -->
  <g transform="translate(400, 320)">
    <path d="M0,-35 C-12,-15 -18,10 0,25 C18,10 12,-15 0,-35 Z" fill="#ffd166" />
    <path d="M0,-20 C-6,-5 -8,8 0,16 C8,8 6,-5 0,-20 Z" fill="#ffffff" />
  </g>
  <!-- Warm Ambient Embers -->
  <g fill="#fca311" opacity="0.65">
    <circle cx="250" cy="420" r="4" />
    <circle cx="560" cy="450" r="3" />
    <circle cx="210" cy="680" r="3.5" />
    <circle cx="600" cy="650" r="4.5" />
  </g>
</svg>